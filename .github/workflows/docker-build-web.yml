name: Build AIBL Cap web image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and publish amd64 image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/cap-web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SELF_HOST_BRAND=ai-build-lab
            NEXT_PUBLIC_WEB_URL=https://vids.aibuildlab.com
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=aibl-cap-web-amd64
          cache-to: type=gha,mode=max,scope=aibl-cap-web-amd64
      - name: Record immutable digest
        run: |
          mkdir -p image-receipt
          printf '%s\n' 'ghcr.io/${{ env.IMAGE_OWNER }}/cap-web@${{ steps.image.outputs.digest }}' > image-receipt/cap-web.txt
      - name: Upload digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cap-web-${{ github.sha }}
          path: image-receipt/cap-web.txt
          if-no-files-found: error
          retention-days: 90
